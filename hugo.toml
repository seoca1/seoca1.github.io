baseURL = "https://seoca1.github.io/learn/"
locale = "en-US"
defaultContentLanguage = "en"
title = "🌍 Multilingual Daily Blog"
theme = "ananke"

# Pagination
paginate = 10

# Ananke theme params
[params]
  mainSections = ["posts", "concepts", "lessons", "culture"]
  description = "Spanish language learning resources - grammar, vocabulary, and culture"
  featured_image = "/images/og-default.png"
  recent_posts_number = 5

# Multilingual
[languages]
  [languages.en]
    weight = 1
    label = "English"
    title = "🌍 Multilingual Daily Blog"
    [languages.en.params]
      description = "Multilingual grammar, vocabulary, and culture for English-speaking learners (Spanish, Japanese, Chinese, Russian)"

# Menu (top nav)
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Lessons"
  url = "/lessons/"
  weight = 2

[[menu.main]]
  name = "Concepts"
  url = "/concepts/"
  weight = 3

[[menu.main]]
  name = "Culture"
  url = "/culture/"
  weight = 4

[[menu.main]]
  name = "Languages"
  url = "/russian/"
  weight = 5

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 6

# Markup - goldmark (default) with table support
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown (for callouts, etc.)

[markup.tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

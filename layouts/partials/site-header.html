{{/*
  Site header — Sticky, backdrop-blur, with theme toggle
  Replaces themes/ananke/layouts/partials/site-header.html
*/}}
<header class="lb-header">
  <div class="lb-header__inner">
    <a href="{{ .Site.Home.RelPermalink }}" class="lb-header__brand">
      {{ with .Site.Params.site_logo }}
        <img src="{{ urls.RelURL . }}" alt="{{ $.Site.Title }}" style="height:1.75rem;display:inline-block;vertical-align:middle;">
      {{ else }}
        {{ .Site.Title }}
      {{ end }}
    </a>
    {{ if .Site.Menus.main }}
    <nav class="lb-header__nav" aria-label="Main">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    {{ end }}
    <div class="lb-header__actions">
      <button class="lb-theme-toggle" type="button" aria-label="Toggle theme" data-theme-toggle>
        <svg class="lb-theme-toggle__icon lb-theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="lb-theme-toggle__icon lb-theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</header>
